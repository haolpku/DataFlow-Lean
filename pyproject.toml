[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dataflow-lean"
version = "0.1.0"
description = "Verifier-in-the-loop Lean 4 data generation and FATE-H evaluation pipeline."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "DataFlow-Lean contributors" }]
dependencies = []

[project.optional-dependencies]
dataflow = ["open-dataflow"]
test = ["pytest>=8,<9"]

[project.scripts]
dataflow-lean-fateh = "dataflow_lean.pipelines.fateh_pipeline:main"

[tool.setuptools.packages.find]
include = ["dataflow_lean*"]

[tool.setuptools.package-data]
"dataflow_lean.pipelines" = ["proof.schema.json"]
